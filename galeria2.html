    <title>Galería: El jardín del olvido</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <header class="encabezado">
        <a class="logo" href="index.html">MEMORIA Y OLVIDO</a>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a class="activo" href="exposiciones.html">Exposiciones</a>
            <a href="visita.html">Planea tu visita</a>
        </nav>
    </header>

    <main>
        <section class="portada-interior">
            <h1>El jardín del olvido</h1>
            <p>Un espacio para reflexionar sobre lo que se ha perdido y lo que se ha conservado.</p>
            <a class="enlace" href="exposiciones.html">Volver a exposiciones</a>
        </section>

        <section class="galeria seccion">
            <figure>
                <img src="img/flor-seca.jpg" alt="Flor seca entre las páginas de un libro">
                <figcaption>
                    <strong>Flor Seca</strong>
                    <br> Una flor guardada entre las páginas de un libro, todavía con un poco de color.                </figcaption>
            </figure>

            <figure>
                <img src="img/foto-descolorida.jpg" alt="Fotografía antigua descolorida">
                <figcaption>
                    <strong>Fotografía Descolorida</strong>
                    <br> Una foto que ha perdido su brillo, pero conserva la memoria de un momento especial.
                </figcaption>
            </figure>

            <figure>
                <img src="img/reloj-detenido.jpg" alt="Reloj antiguo detenido">
                <figcaption>
                    <strong>Reloj detenido</strong>
                    <br> Un reloj que ha dejado de avanzar, pero que aún conserva el tiempo de un momento pasado.
                </figcaption>
            </figure>

            <figure>
                <img src="img/nombre-borrado.jpg" alt="Documento con un nombre borrado">
                <figcaption>
                    <strong>Nombre borrado</strong>
                    <br> Un nombre que ha sido borrado de un documento, pero que aún permanece en la memoria.
                </figcaption>
            </figure>
        </section>
    </main>

    <footer class="pie">

    </footer>
