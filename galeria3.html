    <main>

        <section class="portada-interior">

            <h1>Lo que aún recordamos</h1>
            <p> Una sala para los recuerdos que se resisten a desaparecer. Una canción, un aroma o una fecha pueden llevarnos a un momento exacto, como si no hubiera pasado el tiempo.</p>
            <a class="enlace" href="exposiciones.html"> Volver a exposiciones</a>
        </section>

        <section class="galeria seccion">

            <figure>
                <img src="img/cancion.jpg" alt="Disco de vinilo girando">
                <figcaption>
                    <strong>Una canción</strong>
                    <br>Bastan unas notas para volver a bailar en la cocina de hace diez años.
                </figcaption>
            </figure>

            <figure>
                <img src="img/aroma.jpg" alt="Frasco de perfume">
                <figcaption>
                    <strong>Un aroma</strong>
                    <br>El olor de un perfume puede traer a la memoria a alguien que no vemos hace mucho tiempo.
                </figcaption>
            </figure>

            <figure>
                <img src="img/abrazo.jpg" alt="Dos personas abrazándose">
                <figcaption>
                    <strong>Un abrazo</strong>
                    <br>El recuerdo de un abrazo puede ser tan cálido como el abrazo mismo.
                </figcaption>
            </figure>

            <figure>
                <img src="img/calendario.jpg" alt="Calendario con una fecha marcada">
                <figcaption>
                    <strong>Una fecha</strong>
                    <br>Un día del calendario puede traer a la memoria un momento que no queremos olvidar.
                </figcaption>
            </figure>
        </section>
